corpus:
  languages: [hi, bn, ta, te, kn, mr, gu, ml, pa, or, ur, ne, as, sa]
  passages_per_language: 10000  # default for the 9 languages not scaled up (see overrides below)
  # hi/ta/bn/te/mr raised to 150k passages each - the "must scale" languages plus the
  # 3 largest remaining speaker populations, chosen after confirming the source dataset
  # has ~97,941 rows/language available (only ~15% used at 150k, not a data ceiling).
  # The other 9 languages stay at 10k. See scripts/build_corpus.py --overrides.
  passages_per_language_overrides: {hi: 150000, ta: 150000, bn: 150000, te: 150000, mr: 150000}
  seed: 42

chunking:
  # late_chunking had the best recall@5 in the retrieval eval (0.402-0.566 range across
  # strategies, late_chunking on top) - now also the only strategy built against the
  # scaled corpus. Serving all 5 strategies against a scaled corpus would ~5x the index
  # memory footprint; narrowing to one keeps total RAM roughly flat vs the old 14x10k/
  # 5-strategy build (measured: ~2.57GB old all-5 vs ~2.73GB new late_chunking-only at
  # 150k/5 langs + 10k/9 langs). The other 4 strategies' indexes stay on disk at their
  # old 10k/14-language build (not deleted) but are no longer loaded at startup.
  active_strategy: late_chunking
  strategies: [late_chunking]

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rrf_k: 60
  rerank_candidates: 20
  final_top_k: 5
  ef_search: 64

guardrails:
  # Calibrated against 410 labeled queries (200 answerable, 200 corpus-excluded held-out,
  # 10 off-topic) on the served strategy (recursive_512) via scripts/calibrate_guardrails.py:
  # answer f1=0.593 (p=0.523 r=0.685), abstain f1=0.475 (p=0.574 r=0.405). Picked by
  # maximizing answer_f1 + abstain_f1, not abstain_f1 alone — that alone rewards a
  # degenerate "refuse every query" policy (verified: it produced tp=0, fn=200 on the
  # first run). Full sweep: data/calibration_results.json.
  tau_abs: 0.03
  tau_margin: 0.0
  # 0.5 is not a hand-picked guess: a live sanity check of this exact model
  # (MoritzLaurer/mDeBERTa-v3-base-mnli-xnli) showed genuinely-entailed pairs scoring
  # >0.99 and contradicted pairs <0.001 — the score distribution is bimodal and widely
  # separated, so the threshold's exact position barely matters between roughly 0.05
  # and 0.95. Left as a midpoint rather than run through calibrate_guardrails.py, which
  # only sweeps tau_abs/tau_margin per spec §11.2's explicit "both thresholds" wording
  # (§11.3 doesn't carry the same calibration mandate). Without this, enable_grounding:
  # true was a no-op — app/pipeline.py's gate only fires when grounding_threshold is
  # not None, and null (the original placeholder) silently skipped it every time.
  grounding_threshold: 0.5
  enable_input: true
  enable_retrieval_gate: true
  enable_grounding: true

generation:
  # llama-3.1-8b-instant was retired from Groq's catalog before this build reached
  # Phase 6 (verified live against the account's key, 2026-08-20). openai/gpt-oss-20b
  # is the closest surviving small/fast option, but it's a reasoning model: it spends
  # part of any token budget on invisible chain-of-thought before the visible answer.
  # See app/generation/generator.py and prompt.py for how max_tokens vs
  # max_tokens_request is split to keep the spec's 60-token answer cap meaningful
  # despite that.
  primary: groq
  primary_model: openai/gpt-oss-20b
  primary_reasoning_effort: low
  failover: cerebras
  failover_model: gpt-oss-120b
  max_tokens: 60             # reported/enforced answer-length cap (spec §10's lever)
  # 100 was too tight: live traffic hit "max completion tokens reached before
  # generating a valid document" (json_validate_failed) — 100 has to cover
  # reasoning-token overhead + JSON scaffolding + a 60-word answer, and
  # Devanagari/Tamil/Telugu cost more tokens per word than English, so
  # non-Latin answers were getting truncated mid-document. Raised for headroom.
  max_tokens_request: 200    # raw API budget, leaves room for reasoning-model overhead
  context_token_budget: 1200

harness:
  max_retries: 3
  stage_timeout_ms: {encode: 100, retrieve: 100, rerank: 100, generate: 2000}
  total_deadline_ms: 5000
  breaker_failure_threshold: 5
  breaker_cooldown_s: 30
