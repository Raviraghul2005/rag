[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raingoa-backend"
version = "0.1.0"
# torch/faiss/transformers wheels are unreliable above 3.11 as of this build (verified
# locally: the `py` launcher resolves to 3.14.2) — pin hard, never relax to "<3.13".
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "huggingface-hub>=0.25",
    "python-dotenv>=1.0",
    "transformers>=4.44",
    # torch is a direct runtime import (app/guardrails/grounding.py's plain-PyTorch
    # inference, app/indexing/embeddings.py's ONNX export step) - not just an optimum/
    # transformers transitive dependency, so it must be listed explicitly or a fresh
    # `pip install -e .` (a Docker build) silently omits it and the app ImportErrors on
    # its very first request. CPU build only (see Dockerfile's --extra-index-url) -
    # this container has no GPU and the default PyPI wheel is a multi-GB CUDA build.
    "torch>=2.5",
    "optimum[onnxruntime]>=1.22",
    "faiss-cpu>=1.8",
    "datasets>=2.20",
    "scipy>=1.14",
    "openai>=1.50",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]
