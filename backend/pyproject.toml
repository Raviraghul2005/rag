[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raingoa-backend"
version = "0.1.0"
# torch/faiss/transformers wheels are unreliable above 3.11 as of this build (verified
# locally: the `py` launcher resolves to 3.14.2) — pin hard, never relax to "<3.13".
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "huggingface-hub>=0.25",
    "python-dotenv>=1.0",
    "transformers>=4.44",
    "optimum[onnxruntime]>=1.22",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]
